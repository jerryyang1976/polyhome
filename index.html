<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栖居收纳 · 全屋收纳管家</title>
<script>
/* 设备检测：手机访问时自动跳到手机版 */
(function(){
  var ua=navigator.userAgent||"";
  var mobileUA=/Android|iPhone|iPod|Mobile/i.test(ua)||(ua.indexOf("iPad")>=0)||(navigator.maxTouchPoints>1&&window.innerWidth<900);
  if(mobileUA&&window.innerWidth<820){
    try{location.replace("polymobile.html");}catch(e){}
  }
})();
</script>
<style>
:root{
  --bg:#F3F6F1; --bg2:#E4EAE0; --bg3:#EAF0E6; --card:#FFFFFF;
  --line:#DFE6DA; --ink:#313B2D; --ink2:#5D6A56; --ink3:#8D9884;
  --accent:#6E8467; --accent-bg:#D8E1D2;
  --red:#96674F; --red-bg:#E8D9CE;
  --yellow:#7E7B4A; --yellow-bg:#E5E3CC;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column;font-size:13px;overflow:hidden}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;outline:none}

header{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:0.5px solid var(--line);flex-shrink:0}
.logo{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;letter-spacing:.5px;flex-shrink:0}
.logo .mark{width:22px;height:22px;border-radius:7px;background:var(--accent)}
.search{flex:1;max-width:420px;background:var(--bg2);border:none;border-radius:18px;padding:7px 14px;font-size:12px;color:var(--ink)}
.search::placeholder{color:var(--ink3)}
.btn-primary{background:var(--accent);color:#F3F6F1;border:none;border-radius:18px;padding:7px 16px;font-size:12px}
.btn-primary:hover{filter:brightness(1.05)}
.btn-ghost{background:transparent;border:0.5px solid var(--line);border-radius:14px;padding:5px 12px;font-size:11px;color:var(--ink2)}
.btn-ghost:hover{background:var(--bg2)}

.layout{flex:1;display:flex;min-height:0}
aside{width:172px;border-right:0.5px solid var(--line);padding:14px 10px;overflow-y:auto;flex-shrink:0}
.side-h{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:var(--ink3);letter-spacing:1px;padding:0 6px 8px}
.side-h.mt{margin-top:16px}
.icon-add{width:18px;height:18px;border-radius:6px;background:var(--accent);color:#F3F6F1;border:none;font-size:12px;line-height:1;display:flex;align-items:center;justify-content:center}
.nav-item{padding:7px 10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center;color:var(--ink2);cursor:pointer;position:relative;margin-bottom:2px;font-size:12px}
.nav-item:hover{background:var(--bg2)}
.nav-item.active{background:var(--accent-bg);color:var(--ink)}
.nav-item .cnt{font-size:11px;color:var(--ink3)}
.nav-item.active .cnt{color:var(--ink3)}
#storeWarn{grid-column:1/-1}
.store-warn{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 0 14px;padding:10px 16px;border-radius:12px;font-size:13px;line-height:1.5;background:#E9EFE4;color:#4A5A44;border:1px solid #CBD8C1}
.store-warn.danger{background:#F2E4DE;color:#7A4A38;border-color:#DFC4B8}
.sw-ok{flex-shrink:0;border:1px solid #A9BAA0;background:#fff;color:#4A5A44;border-radius:999px;padding:4px 14px;font-size:12px;cursor:pointer}
.nav-item[draggable="true"]{cursor:grab}
.nav-item.dragging{opacity:.45}
.nav-item.drop-before{box-shadow:0 -2px 0 0 var(--accent) inset}
.nav-item .ops{display:none;position:absolute;right:6px;gap:3px}
.nav-item:hover .ops{display:flex}
.nav-item:hover .cnt{visibility:hidden}
.op{width:17px;height:17px;border-radius:5px;background:#fff;border:none;font-size:9px;display:flex;align-items:center;justify-content:center;color:var(--ink2)}
.op.del{color:var(--red)}
.cat-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

main{flex:1;padding:14px 18px;overflow-y:auto;min-width:0}
.main-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.main-title{font-size:14px;font-weight:500}
.chips{display:flex;gap:6px}
.chip{font-size:11px;padding:4px 11px;background:var(--bg2);border:none;border-radius:14px;color:var(--ink2)}
.chip.active{background:var(--accent);color:#F3F6F1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:10px;cursor:pointer;position:relative}
.card:hover{border-color:#C8D2C1}
.card .ico{height:52px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;margin-bottom:8px;color:var(--accent);cursor:pointer}
.card .ico:hover{background:var(--accent-bg)}
.card .nm{font-size:12px;font-weight:500;color:var(--ink);padding-right:16px;word-break:break-all}
.card .loc{font-size:11px;color:var(--ink3);margin-top:2px}
.badge{font-size:10px;margin-top:6px;padding:2px 8px;display:inline-block;border-radius:10px}
.b-red{background:var(--red-bg);color:var(--red)}
.b-yellow{background:var(--yellow-bg);color:var(--yellow)}
.b-ok{background:#E3EBDD;color:var(--accent)}
.card .card-ops{display:none;position:absolute;top:8px;right:8px;gap:3px}
.card:hover .card-ops{display:flex}
.card .ico.photo{padding:0;overflow:hidden;position:relative}
.card .ico.photo img{width:100%;height:100%;object-fit:cover;display:block}
.card .ico .ph-cnt{position:absolute;right:4px;bottom:4px;background:rgba(49,59,45,.55);color:#fff;font-size:10px;border-radius:8px;padding:1px 6px}
.ph-edit{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.ph-thumbs{display:flex;flex-wrap:wrap;gap:6px}
.ph-thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;cursor:pointer;border:0.5px solid var(--line)}
.ph-thumb.cur{box-shadow:0 0 0 2px var(--accent)}
.ph-del{position:relative}
.ph-del button{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:5px;border:none;background:rgba(49,59,45,.55);color:#fff;font-size:9px;line-height:1;cursor:pointer}
.pv-main{background:var(--bg);border-radius:10px;display:flex;align-items:center;justify-content:center;min-height:220px;margin-bottom:10px;overflow:hidden}
.pv-main img{max-width:100%;max-height:46vh;display:block}
.pv-nav{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:10px}
.pv-nav button{border:none;background:var(--bg2);border-radius:8px;padding:4px 12px;font-size:12px;color:var(--ink2)}
.pv-nav button:disabled{opacity:.4;cursor:default}
.add-card{border:0.5px dashed #B9C5B0;border-radius:12px;padding:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ink3);font-size:11px;min-height:130px;gap:4px;cursor:pointer;background:transparent}
.add-card:hover{background:var(--bg3)}
.add-card .plus{font-size:18px;color:#A6B19D}
.empty{color:var(--ink3);font-size:12px;text-align:center;padding:60px 0}

footer{border-top:0.5px solid var(--line);background:var(--bg2);padding:9px 18px;display:flex;gap:8px;align-items:center;font-size:12px;flex-shrink:0;overflow-x:auto;white-space:nowrap}
.wlabel{color:var(--ink3);font-size:11px;flex-shrink:0}
.wchip{padding:2px 9px;border-radius:10px;background:#fff;font-size:11px;cursor:pointer;flex-shrink:0}
.wchip.red{color:var(--red)}
.wchip.yellow{color:var(--yellow)}
.wmore{margin-left:auto;color:#A6B19D;font-size:11px;flex-shrink:0}

.mask{position:fixed;inset:0;background:rgba(49,59,45,.28);display:flex;align-items:center;justify-content:center;z-index:50}
.dialog{background:#fff;border-radius:14px;padding:16px 18px;width:420px;max-width:92vw;max-height:88vh;overflow-y:auto}
.dlg-title{font-size:13px;font-weight:500;margin-bottom:12px}
.dlg-sub{font-size:11px;color:var(--ink3);margin:-8px 0 12px}
.fld{margin-bottom:10px}
.fld label{font-size:11px;color:var(--ink2);display:block;margin-bottom:4px}
.fld input[type=text],.fld input[type=number],.fld input[type=date],.fld select,.fld textarea{width:100%;font-size:12px;padding:7px 10px;background:var(--bg);border:none;border-radius:8px;color:var(--ink)}
.fld textarea{resize:vertical;min-height:44px}
.fld .hint{font-size:10px;color:var(--ink3);margin-top:3px}
.row{display:flex;gap:8px}
.row>*{flex:1}
.tag{font-size:11px;padding:3px 9px;background:var(--bg2);border-radius:12px;color:var(--ink);display:inline-flex;align-items:center;gap:5px;margin:0 6px 6px 0}
.tag button{border:none;background:none;color:var(--ink3);font-size:10px;padding:0;line-height:1}
.tag button:hover{color:var(--red)}
.tag-add{font-size:11px;padding:3px 9px;border:0.5px dashed #B9C5B0;border-radius:12px;color:var(--ink3);background:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:22px;height:22px;border-radius:50%;cursor:pointer;border:2px solid transparent}
.sw.sel{border-color:var(--ink)}
.icon-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;max-height:260px;overflow-y:auto}
.icell{height:38px;background:var(--bg);border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink2);border:none}
.icell:hover{background:var(--bg2)}
.icell.sel{background:var(--accent-bg);color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.dlg-btns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn-cancel{font-size:11px;padding:5px 14px;background:var(--bg2);border:none;border-radius:14px;color:var(--ink2)}
.btn-ok{font-size:11px;padding:5px 14px;background:var(--accent);border:none;border-radius:14px;color:#F3F6F1}
.btn-danger{background:var(--red)}
.cur-icon{width:52px;height:52px;border-radius:8px;background:var(--bg3);display:flex;align-items:center;justify-content:center;color:var(--accent);cursor:pointer;margin-bottom:4px}
.confirm-msg{font-size:12px;color:var(--ink2);line-height:1.7;padding:4px 0 8px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:#CBD5C3;border-radius:4px}
</style>

<body>

<header>
  <div class="logo"><div class="mark"></div><span id="appTitle" data-act="title-edit" style="cursor:pointer" title="点击修改名称">栖居收纳</span></div>
  <input id="searchBox" class="search" type="text" placeholder="搜索物品、位置、标签…">
  <button class="btn-ghost" data-act="cloud-settings" id="cloudBtn" title="配置Supabase云数据库">☁ 云同步设置</button><span id="cloudStat" style="font-size:12px;color:#5D6A56;white-space:nowrap">☁ 未配置</span>
  <button class="btn-ghost" data-act="export">导出</button>
  <button class="btn-ghost" data-act="import">导入</button>
  <button class="btn-primary" data-act="item-add">＋ 添加物品</button>
  <input type="file" id="importFile" accept=".json" hidden>
</header>
<div id="storeWarn"></div>

<div class="layout">
  <aside id="sidebar"></aside>
  <main>
    <div class="main-head">
      <div class="main-title" id="mainTitle">全屋总览</div>
      <div class="chips" id="filterChips"></div>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>

<footer id="warnBar"></footer>
<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
"use strict";
/* ================= 数据 ================= */
const KEY="home_storage_v1";
let db=null;
const view={room:"all",cat:null,storage:null,filter:"all",search:""};

function uid(p){return (p||"id")+"_"+Math.random().toString(36).slice(2,9);}
function todayOffset(days){const d=new Date();d.setDate(d.getDate()+days);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function daysLeft(dateStr){if(!dateStr)return null;
  const t=new Date(dateStr+"T23:59:59").getTime();
  return Math.ceil((t-Date.now())/86400000);}

function seed(){
  const r1=uid("r"),r2=uid("r"),r3=uid("r"),r4=uid("r"),r5=uid("r");
  const s=v=>uid("s");
  const st={};
  const rooms=[
    {id:r1,name:"厨房",storages:[{id:uid("s"),name:"冰箱冷藏室"},{id:uid("s"),name:"冰箱门架"},{id:uid("s"),name:"调味柜"},{id:uid("s"),name:"橱柜下层"}]},
    {id:r2,name:"客厅",storages:[{id:uid("s"),name:"电视柜"},{id:uid("s"),name:"茶几抽屉"}]},
    {id:r3,name:"卧室",storages:[{id:uid("s"),name:"衣柜"},{id:uid("s"),name:"床头柜"}]},
    {id:r4,name:"卫生间",storages:[{id:uid("s"),name:"药箱"},{id:uid("s"),name:"洗手台"}]},
    {id:r5,name:"储物间",storages:[{id:uid("s"),name:"货架A"},{id:uid("s"),name:"货架B"}]}
  ];
  st[r1]=rooms[0].storages; st[r4]=rooms[3].storages; st[r5]=rooms[4].storages;
  const cats=[
    {id:"food",name:"食品饮品",color:"#A8B08A"},
    {id:"med",name:"药品保健",color:"#6E8467"},
    {id:"daily",name:"日用品",color:"#9AA894"},
    {id:"cloth",name:"衣物被褥",color:"#B3B89A"},
    {id:"tool",name:"工具数码",color:"#84968C"}
  ];
  const it=(name,qty,unit,roomId,storageId,catId,exp,icon,note)=>({id:uid("i"),name,qty,unit,roomId,storageId,categoryId:catId,expiry:exp,icon,note:note||""});
  const items=[
    it("鲜牛奶 1L",1,"盒",r1,st[r1][0].id,"food",todayOffset(1),"milk"),
    it("鸡蛋",10,"枚",r1,st[r1][1].id,"food",todayOffset(5),"egg"),
    it("阿莫西林胶囊",2,"盒",r4,st[r4][0].id,"med",todayOffset(28),"capsule"),
    it("碘伏消毒液",1,"瓶",r4,st[r4][0].id,"med",todayOffset(17),"spray"),
    it("大米 5kg",1,"袋",r1,st[r1][3].id,"food",null,"rice"),
    it("生抽 500ml",1,"瓶",r1,st[r1][2].id,"food",todayOffset(120),"drop"),
    it("洗发水",1,"瓶",r4,st[r4][1].id,"daily",null,"soap"),
    it("换季衣物箱",1,"个",r5,st[r5][1].id,"cloth",null,"box")
  ];
  return {rooms,cats,items};
}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);
    if(d&&Array.isArray(d.items))return d;}}catch(e){}
  return null;
}
/* ================= 云端同步（Supabase） ================= */
/* 首次使用：点顶部「☁ 云同步设置」填入项目地址和 anon key；
   若想换浏览器也免配置，可把值直接填到下面两行引号里 */
var SB_URL="";
var SB_KEY="";
var cloudClient=null,cloudTimer=null,pushing=false;

function sbConfig(){
  let url=SB_URL,key=SB_KEY;
  try{url=localStorage.getItem(KEY+"_sburl")||url;key=localStorage.getItem(KEY+"_sbkey")||key;}catch(e){}
  url=(url||"").trim();key=(key||"").trim();
  return (url&&key&&url.indexOf("http")===0&&key.length>20)?{url:url,key:key}:null;
}
function cloudReady(){return !!cloudClient;}
function cloudInit(){
  const c=sbConfig();
  if(!c){cloudClient=null;return false;}
  try{cloudClient=window.supabase.createClient(c.url,c.key);return true;}
  catch(e){cloudClient=null;return false;}
}
var lastWrite=null;
function fmtClock(d){return String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+":"+String(d.getSeconds()).padStart(2,"0");}
function setCloudStat(txt){const b=document.getElementById("cloudStat");if(b)b.textContent=txt;}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(db));}
  catch(e){showStoreWarn("⚠ 本地缓存写入失败（照片较多时易触发空间上限）。云端同步不受影响，但本次修改在刷新后需从云端拉取。",true);}
  if(cloudReady()){clearTimeout(cloudTimer);cloudTimer=setTimeout(cloudPush,800);}
}
db=load()||seed(); if(!load())save();

function showStoreWarn(html,danger,extraBtn){
  const el=document.getElementById("storeWarn");
  if(!el)return;
  el.innerHTML='<div class="store-warn '+(danger?"danger":"")+'"><span>'+html+'</span>'
    +(extraBtn!==undefined?extraBtn:(danger?"":'<button class="sw-ok" data-act="store-hint-ok">知道了</button>'))+'</div>';
}

/* ============ 云端同步核心 ============ */
async function cloudPush(attempt){
  if(!cloudClient)return;
  attempt=attempt||0;
  if(pushing)return;
  pushing=true;
  try{
    const {error}=await cloudClient.from("home_storage")
      .upsert({id:"main",data:db,updated_at:new Date().toISOString()});
    if(error)throw error;
    lastWrite=new Date();
    setCloudStat("☁ 已同步 "+fmtClock(lastWrite));
    const el=document.getElementById("storeWarn");
    if(el&&el.innerHTML.indexOf("云端同步失败")>=0)el.innerHTML="";
  }catch(e){
    if(attempt<2){setTimeout(()=>cloudPush(attempt+1),[1000,3000][attempt]);return;}
    setCloudStat("☁ 同步失败");
    showStoreWarn("⚠ 云端同步失败："+esc(e.message||e)+"。数据已暂存本机缓存，修复配置后点「立即同步」即可上传，不会丢失。",true,
      '<button class="sw-ok" data-act="cloud-push">立即同步</button>');
  }finally{pushing=false;}
}
async function cloudPull(needRender){
  if(!cloudClient)return null;
  const {data,error}=await cloudClient.from("home_storage")
    .select("data,updated_at").eq("id","main").maybeSingle();
  if(error)throw error;
  if(data&&data.data&&Array.isArray(data.data.items)&&Array.isArray(data.data.rooms)){
    db=data.data;if(needRender)render();return data;
  }
  return null;
}

/* 把文件中的物品清单合并进当前数据（不改动现有房间和物品）；同名物品视为重复，跳过不录入 */
function mergeItems(d){
  let added=0,skipped=0;
  d.items.forEach(it=>{
    if(dupCheck(it.name,null)){skipped++;return;}
    const cat=db.cats.some(c=>c.id===it.categoryId)?it.categoryId:db.cats[0].id;
    db.items.push({
      id:it.id||uid("i"),
      name:it.name||"未命名物品",
      qty:it.qty!=null?it.qty:null,
      unit:it.unit||"",
      roomId:null,storageId:null,
      categoryId:cat,
      expiry:it.expiry||null,
      note:it.note||"",
      icon:ICONS[it.icon]?it.icon:matchIcon(it.name||"",cat),
      photos:Array.isArray(it.photos)?it.photos.filter(p=>typeof p==="string"&&p.indexOf("data:image")===0).slice(0,9):[]
    });
    added++;
  });
  return {added,skipped};
}

/* 云同步设置弹窗 */
function openCloudSettings(){
  const c=sbConfig();
  openModal('<div class="dlg-title">☁ 云同步设置（Supabase）</div>'
    +'<div class="fld"><label>项目地址（Project URL）</label><input type="text" id="sb_url" value="'+esc(c?c.url:"")+'" placeholder="https://xxxx.supabase.co"></div>'
    +'<div class="fld"><label>anon public key</label><input type="text" id="sb_key" value="'+esc(c?c.key:"")+'" placeholder="eyJhbGciOi...（anon public）"></div>'
    +'<div class="fld" style="font-size:12px;color:#6B6960;line-height:1.7;text-align:left">获取：登录 supabase.com → 打开项目 → Settings → API，复制 Project URL 与 anon public key。<br>首次使用需在项目 SQL Editor 中执行建表 SQL（找我要）。<br>配置保存在本机浏览器；若换设备需重填，也可直接写进本文件头部的 SB_URL / SB_KEY。</div>'
    +'<div class="dlg-btns"><button class="btn-cancel" data-act="close-modal">取消</button><button class="btn-cancel" data-act="cloud-test">测试连接</button><button class="btn-ok" data-act="cloud-save">保存</button></div>');
}
function readCfgInputs(){
  const url=document.getElementById("sb_url").value.trim();
  const key=document.getElementById("sb_key").value.trim();
  if(!(url&&key&&url.indexOf("http")===0&&key.length>20)){
    showStoreWarn("请填写有效的项目地址（https://开头）和 anon key。",true);return null;
  }
  return {url:url,key:key};
}
async function cloudTestConn(){
  const c=readCfgInputs();if(!c)return;
  try{
    const t=window.supabase.createClient(c.url,c.key);
    const {error}=await t.from("home_storage").select("id").limit(1);
    if(error)throw error;

/* 启动：拉取云端数据（云端优先），云端为空则上传本地数据 */
async function cloudStartup(){
  if(!cloudInit()){
    setCloudStat("☁ 未配置");
    try{if(!localStorage.getItem(KEY+"_sbhintDone")){
      showStoreWarn("欢迎使用云同步版：数据保存在 Supabase 云数据库，任何浏览器、任何设备打开都是同一份，彻底告别浏览器存储丢失。<br>首次使用请点顶部「☁ 云同步设置」填入项目地址和 anon key。");
    }}catch(e){}
    return;
  }
  setCloudStat("☁ 连接中…");
  try{
    const row=await cloudPull(false);
    if(row){
      save();
      setCloudStat("☁ 已同步"+(row.updated_at?"（云端更新于 "+new Date(row.updated_at).toLocaleString("zh-CN",{hour12:false})+"）":""));
      render();
    }else{
      await cloudPush();
    }
  }catch(e){
    setCloudStat("☁ 连接失败");
    showStoreWarn("⚠ 连接 Supabase 失败："+esc(e.message||e)+"。当前显示的是本机缓存数据；检查网络或点顶部按钮核对配置。",true,
      '<button class="sw-ok" data-act="cloud-push">重试</button>');
  }
}
cloudStartup();

/* ================= 效期计算 ================= */
function thresholds(it){
  const c=it.categoryId;
  if(c==="med")return{red:30,yellow:90};
  if(c==="food")return{red:3,yellow:7};
  return{red:7,yellow:30};
}
function badgeInfo(it){
  const d=daysLeft(it.expiry);
  if(d===null)return null;
  const t=thresholds(it);
  const pre=(it.categoryId==="med")?"效期":"";
  let cls,text;
  if(d<0){cls="b-red";text="已过期 "+(-d)+" 天";}
  else if(d<=t.red){cls="b-red";text=pre+"剩 "+d+" 天";}
  else if(d<=t.yellow){cls="b-yellow";text=pre+"剩 "+d+" 天";}
  else{cls="b-ok";text=d>60?pre+"剩 "+Math.round(d/30)+" 个月":pre+"剩 "+d+" 天";}
  return{cls,text,d};
}

/* ================= 渲染 ================= */
function scopedItems(){
  let arr=db.items.slice();
  if(view.room!=="all")arr=arr.filter(i=>i.roomId===view.room);
  if(view.storage)arr=arr.filter(i=>i.storageId===view.storage);
  if(view.cat)arr=arr.filter(i=>i.categoryId===view.cat);
  return arr;
}
function visibleItems(){
  let arr=scopedItems();
  if(view.filter==="exp")arr=arr.filter(i=>i.expiry);
  if(view.filter==="soon")arr=arr.filter(i=>{const b=badgeInfo(i);return b&&b.d<=thresholds(i).yellow;});
  if(view.search){
    const q=view.search.toLowerCase();
    arr=arr.filter(i=>(i.name+" "+locationText(i)+" "+(i.note||"")).toLowerCase().includes(q));
  }
  arr.sort((a,b)=>{
    const da=a.expiry?daysLeft(a.expiry):1e9,dbb=b.expiry?daysLeft(b.expiry):1e9;
    if(da!==dbb)return da-dbb;
    return a.name.localeCompare(b.name,"zh");
  });
  return arr;
}

      compressImage(f,url=>{

        _itemDraft.photos.push(url);

      });

function refreshExpHint(){
  const c=document.getElementById("f_cat").value;
  const t=c==="med"?"药品：剩 30 天内红色警示，90 天内黄色警示":c==="food"?"食品：剩 3 天内红色警示，7 天内黄色警示":"其他：剩 7 天内红色警示，30 天内黄色警示";
  document.getElementById("expHint").textContent=t;
}
function dupCheck(name,excludeId){
  const n=(name||"").trim().toLowerCase();
  if(!n)return null;
  return db.items.find(i=>i.id!==excludeId&&(i.name||"").trim().toLowerCase()===n);
}
function doSaveItem(id,obj){
  if(id){Object.assign(db.items.find(i=>i.id===id),obj);}
  else{obj.id=uid("i");db.items.push(obj);}
  save();closeModal();render();
}
function saveItem(id){
  const name=document.getElementById("f_name").value.trim();
  if(!name){document.getElementById("f_name").focus();return;}
  const qtyRaw=document.getElementById("f_qty").value;
  const obj={
    name,
    qty:qtyRaw===""?null:Number(qtyRaw),
    unit:document.getElementById("f_unit").value.trim(),
    categoryId:document.getElementById("f_cat").value,
    roomId:document.getElementById("f_room").value||null,
    storageId:document.getElementById("f_storage").value||null,
    expiry:document.getElementById("f_exp").value||null,
    note:document.getElementById("f_note").value.trim(),
    photos:_itemDraft.photos.slice(),
    icon:_itemDraft.icon||matchIcon(name,document.getElementById("f_cat").value)
  };
  /* 重复物品检测：同名物品已存在时默认不录入 */
  const dup=dupCheck(name,id);
  if(dup){
    openConfirm('已存在同名物品「'+esc(dup.name)+'」<br>（'+esc(locationText(dup))+'，数量 '+(dup.qty!=null?dup.qty+(dup.unit||""):"未填")+'，'+(getCat(dup.categoryId)?getCat(dup.categoryId).name:"")+'）<br><br>重复物品不建议录入。'
      +'若要修改已有物品的信息，请取消后在卡片上直接编辑。',
      "仍要保存","取消（不录入）",
      ()=>doSaveItem(id,obj),null,true);
    return;
  }
  doSaveItem(id,obj);
}

/* ================= 存储区管理 ================= */
function findStorage(sid){
  for(const r of db.rooms){const s=r.storages.find(x=>x.id===sid);if(s)return{room:r,s};}
  return null;
}
let _stgDraft=null;
function openStorageModal(sid){
  const f=sid?findStorage(sid):null;
  _stgDraft={id:sid||null,roomId:f?f.room.id:(db.rooms[0]?db.rooms[0].id:""),name:f?f.s.name:""};
  renderStorageModal();
}
function renderStorageModal(){
  const opts=db.rooms.map(r=>'<option value="'+r.id+'" '+(r.id===_stgDraft.roomId?"selected":"")+'>'+esc(r.name)+'</option>').join("");
  openModal('<div class="dlg-title">'+(_stgDraft.id?"编辑存储区":"新增存储区")+'</div>'
  +'<div class="fld"><label>所属房间</label><select id="sg_room">'+opts+'</select></div>'
  +'<div class="fld"><label>存储区名称 *</label><input type="text" id="sg_name" value="'+esc(_stgDraft.name)+'" placeholder="如：冰箱冷藏室"></div>'
  +dlgBtns('<button class="btn-ok" data-act="stg-save">保存</button>'));
  const inp=document.getElementById("sg_name");
  inp.focus();inp.value=_stgDraft.name;
  inp.addEventListener("input",()=>{_stgDraft.name=inp.value;});
  document.getElementById("sg_room").addEventListener("change",e=>{_stgDraft.roomId=e.target.value;});
}
function saveStorageModal(){
  const name=document.getElementById("sg_name").value.trim();
  const roomId=document.getElementById("sg_room").value;
  if(!name){document.getElementById("sg_name").focus();return;}
  const room=getRoom(roomId);if(!room)return;
  if(_stgDraft.id){
    const f=findStorage(_stgDraft.id);if(!f)return;
    if(f.room.id!==room.id){
      f.room.storages=f.room.storages.filter(x=>x.id!==_stgDraft.id);
      room.storages.push(f.s);
      db.items.forEach(i=>{if(i.storageId===_stgDraft.id)i.roomId=room.id;});
    }
    f.s.name=name;
  }else{
    room.storages.push({id:uid("s"),name:name});
  }
  save();closeModal();render();
}

/* ================= 导入导出 ================= */
function doExport(){
  const blob=new Blob([JSON.stringify(db,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  const d=new Date();
  a.download="收纳数据_"+d.getFullYear()+String(d.getMonth()+1).padStart(2,"0")+String(d.getDate()).padStart(2,"0")+".json";
  a.click();URL.revokeObjectURL(a.href);
}

/* ================= 事件分发 ================= */
document.addEventListener("click",e=>{
  const mask=e.target.dataset&&e.target.dataset.mask;
  if(mask){closeModal();return;}
  const el=e.target.closest("[data-act]");
  if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  e.stopPropagation();
  switch(act){
    case "room":view.room=id;view.cat=null;view.storage=null;render();break;
    case "cat":{
      view.cat=(view.cat===id)?null:id;
      view.room="all";view.storage=null;
      render();break;}
    case "stg-nav":{
      view.storage=(view.storage===id)?null:id;
      view.room="all";view.cat=null;
      render();break;}
    case "stg-add":openStorageModal();break;
    case "stg-edit":{
      e.stopPropagation();
      openStorageModal(id);break;}
    case "stg-del":{
      e.stopPropagation();
      const f=findStorage(id);if(!f)break;
      const sn=db.items.filter(i=>i.storageId===id).length;
      openConfirm('删除存储区「'+esc(f.room.name+" · "+f.s.name)+'」？<br>其中 <b>'+sn+'</b> 件物品将保留在房间内（位置变为未指定）。',"删除",null,
        ()=>{f.room.storages=f.room.storages.filter(x=>x.id!==id);
          db.items.forEach(i=>{if(i.storageId===id)i.storageId=null;});
          if(view.storage===id)view.storage=null;
          save();closeModal();render();},null,true);
      break;}
    case "stg-save":saveStorageModal();break;
    case "title-edit":openTitleModal();break;
    case "title-save":saveTitleModal();break;
    case "filter":view.filter=el.dataset.v;render();break;
    case "room-add":openRoomModal();break;
    case "room-edit":e.stopPropagation();openRoomModal(id);break;
    case "room-del":{
      e.stopPropagation();
      const r=getRoom(id);if(!r)break;
      const n=db.items.filter(i=>i.roomId===id).length;
      openConfirm('删除房间「'+esc(r.name)+'」？<br>该房间还有 <b>'+n+'</b> 件物品。',
        "一并删除",n?"物品移到未分配":"",
        ()=>{db.rooms=db.rooms.filter(x=>x.id!==id);db.items=db.items.filter(i=>i.roomId!==id);
          if(view.room===id)view.room="all";save();closeModal();render();},
        ()=>{db.rooms=db.rooms.filter(x=>x.id!==id);db.items.forEach(i=>{if(i.roomId===id){i.roomId=null;i.storageId=null;}});
          if(view.room===id)view.room="all";save();closeModal();render();},
        true);
      break;}
    case "cat-add":openCatModal();break;
    case "cat-edit":e.stopPropagation();openCatModal(id);break;
    case "cat-del":{
      e.stopPropagation();
      const c=getCat(id);if(!c)break;
      if(db.cats.length<=1){openConfirm('至少保留一个分类，无法删除。',"知道了","",()=>closeModal());break;}
      const n=db.items.filter(i=>i.categoryId===id).length;
      openConfirm('删除分类「'+esc(c.name)+'」？<br>该分类下 <b>'+n+'</b> 件物品将移入第一个分类。',
        "删除",null,
        ()=>{const fb=db.cats.find(x=>x.id!==id);
          db.cats=db.cats.filter(x=>x.id!==id);
          db.items.forEach(i=>{if(i.categoryId===id)i.categoryId=fb.id;});
          if(view.cat===id)view.cat=null;
          save();closeModal();render();},
        null,true);
      break;}
    case "item-add":openItemModal();break;
    case "item-edit":openItemModal(id);break;
    case "item-del":{
      e.stopPropagation();
      const it=db.items.find(i=>i.id===id);if(!it)break;
      openConfirm('删除物品「'+esc(it.name)+'」？此操作不可恢复。',"删除",null,
        ()=>{db.items=db.items.filter(i=>i.id!==id);save();closeModal();render();},null,true);
      break;}
    case "item-save":saveItem(id||null);break;
    case "icon-pick-item":{
      e.stopPropagation();
      const it=db.items.find(i=>i.id===id);if(!it)break;
      openIconPicker(it.icon||"box",k=>{it.icon=k;save();closeModal();render();});
      break;}
    case "photo-open":e.stopPropagation();openPhotoViewer(id,0);break;
    case "photo-add-btn":{const f=document.getElementById("f_photos");if(f)f.click();break;}
    case "photo-del-draft":{
      e.stopPropagation();
      _itemDraft.photos.splice(Number(el.dataset.i),1);
      renderPhotoEdit();break;}
    case "photo-open-draft":{
      e.stopPropagation();
      window.open(el.src,"_blank");break;}
    case "photo-prev":_pv.idx--;renderPhotoViewer();break;
    case "photo-next":_pv.idx++;renderPhotoViewer();break;
    case "photo-thumb":_pv.idx=Number(el.dataset.i);renderPhotoViewer();break;
    case "photo-del-view":{
      const pit=db.items.find(i=>i.id===_pv.itemId);
      if(pit){pit.photos.splice(_pv.idx,1);save();
        if(!pit.photos.length){closeModal();render();}
        else{renderPhotoViewer();render();}}
      break;}
    case "icon-cell":{
      e.stopPropagation();
      if(_pickerCb){const cb=_pickerCb;_pickerCb=null;cb(el.dataset.k);}
      closeModal();break;}
    case "room-save":saveRoom();break;
    case "storage-add":addStorage();break;
    case "storage-del":{
      e.stopPropagation();
      _roomDraft.storages.splice(Number(el.dataset.i),1);
      renderRoomModal();break;}
    case "cat-save":saveCat();break;
    case "swatch":{
      e.stopPropagation();
      _catDraft.color=el.dataset.c;
      document.querySelectorAll(".sw").forEach(s=>s.classList.toggle("sel",s.dataset.c===_catDraft.color));
      break;}
    case "export":doExport();break;
    case "import":document.getElementById("importFile").click();break;
    case "store-hint-ok":{try{localStorage.setItem(KEY+"_hintDone","1")}catch(e){}document.getElementById("storeWarn").innerHTML="";break;}
    case "cloud-settings":openCloudSettings();break;
    case "cloud-test":cloudTestConn();break;
    case "cloud-save":cloudSaveCfg();break;
    case "cloud-push":cloudPush();break;
    case "close-modal":closeModal();break;
    case "confirm-yes":if(_confirmCb&&_confirmCb.onYes)_confirmCb.onYes();_confirmCb=null;break;
    case "confirm-alt":if(_confirmCb&&_confirmCb.onAlt)_confirmCb.onAlt();_confirmCb=null;break;
  }
});

document.getElementById("importFile").addEventListener("change",e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d||!Array.isArray(d.items))throw 0;
      /* 只有 rooms 有实际内容的文件才整体替换；rooms 为空（如拍照识别App生成）走合并 */
      if(Array.isArray(d.rooms)&&d.rooms.length>0&&Array.isArray(d.cats)){
        db=d;save();render();
        openConfirm('数据导入成功（整体替换），共 '+d.items.length+' 件物品。'
          +(cloudReady()?'<br>✓ 已同步到云端数据库':'<br>⚠ 云同步未配置，数据仅暂存本机——请点「☁ 云同步设置」配置后点「立即同步」上传。'),"好的",null,()=>closeModal());
      }else{
        const r=mergeItems(d);
        save();render();
        openConfirm('合并导入成功，新增 '+r.added+' 件物品'+(r.skipped>0?'，跳过重复 '+r.skipped+' 件':'')+'（房间与已有数据未变动）。<br>新增物品位置为「未分配」，请到全屋总览逐件设置存放位置。'
          +(cloudReady()?'<br>✓ 已同步到云端数据库':'<br>⚠ 云同步未配置，数据仅暂存本机——请点「☁ 云同步设置」配置后点「立即同步」上传。'),"好的",null,()=>closeModal());
      }
    }catch(err){openConfirm('导入失败：文件格式不正确。',"知道了",null,()=>closeModal());}
  };
  rd.readAsText(f);
  e.target.value="";
});

/* ================= 照片功能 ================= */
function compressImage(file,cb){
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=480;
      let w=img.width,h=img.height;
      if(w>MAX||h>MAX){const k=MAX/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
      const cv=document.createElement("canvas");
      cv.width=w;cv.height=h;
      cv.getContext("2d").drawImage(img,0,0,w,h);
      cb(cv.toDataURL("image/jpeg",0.72));
    };
    img.onerror=()=>cb(null);
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}
function renderPhotoEdit(){
  const box=document.getElementById("phEdit");
  if(!box)return;
  box.innerHTML=_itemDraft.photos.map((p,i)=>
    '<span class="ph-del"><img class="ph-thumb" src="'+p+'" data-act="photo-open-draft" data-i="'+i+'">'
    +'<button data-act="photo-del-draft" data-i="'+i+'" title="删除照片">✕</button></span>').join("");
}
let _pv={itemId:null,idx:0};
function openPhotoViewer(id,idx){
  const it=db.items.find(i=>i.id===id);
  if(!it||!it.photos||!it.photos.length)return;
  _pv={itemId:id,idx:idx||0};
  renderPhotoViewer();
}
function renderPhotoViewer(){
  const it=db.items.find(i=>i.id===_pv.itemId);
  if(!it){closeModal();return;}
  const ph=it.photos;
  if(_pv.idx>=ph.length)_pv.idx=ph.length-1;
  if(_pv.idx<0)_pv.idx=0;
  const cur=ph[_pv.idx];
  openModal('<div class="dlg-title">照片 · '+esc(it.name)+' <span style="font-weight:400;color:var(--ink3);font-size:11px">('+(_pv.idx+1)+'/'+ph.length+')</span></div>'
  +'<div class="pv-main"><img src="'+cur+'" alt=""></div>'
  +(ph.length>1?'<div class="pv-nav"><button data-act="photo-prev" '+(ph.length<2?"disabled":"")+'>‹ 上一张</button><button data-act="photo-next">下一张 ›</button></div>':"")
  +'<div class="ph-thumbs" style="margin-bottom:6px">'+ph.map((p,i)=>'<img class="ph-thumb '+(i===_pv.idx?"cur":"")+'" src="'+p+'" data-act="photo-thumb" data-i="'+i+'">').join("")+'</div>'
  +'<div class="dlg-btns"><button class="btn-cancel" data-act="photo-del-view">删除此照片</button><button class="btn-ok" data-act="close-modal">关闭</button></div>');
}

/* ================= 侧边栏拖拽排序 ================= */
let dragState=null;
function reorderItems(kind,src,dst){
  if(src===dst)return;
  const arr=kind==="room"?db.rooms:db.cats;
  const si=arr.findIndex(x=>x.id===src),di=arr.findIndex(x=>x.id===dst);
  if(si<0||di<0)return;
  const m=arr.splice(si,1)[0];
  arr.splice(di,0,m);
  save();render();
}
document.addEventListener("dragstart",e=>{
  const el=e.target.closest("[data-drag]");
  if(!el)return;
  dragState={kind:el.dataset.drag,id:el.dataset.id};
  el.classList.add("dragging");
  e.dataTransfer.effectAllowed="move";
  try{e.dataTransfer.setData("text/plain",el.dataset.id);}catch(err){}
});
document.addEventListener("dragover",e=>{
  if(!dragState)return;
  const el=e.target.closest("[data-drag]");
  if(!el||el.dataset.drag!==dragState.kind)return;
  e.preventDefault();
  e.dataTransfer.dropEffect="move";
  document.querySelectorAll(".drop-before").forEach(x=>x.classList.remove("drop-before"));
  if(el.dataset.id!==dragState.id)el.classList.add("drop-before");
});
document.addEventListener("drop",e=>{
  if(!dragState)return;
  const el=e.target.closest("[data-drag]");
  if(el&&el.dataset.drag===dragState.kind){
    e.preventDefault();
    reorderItems(dragState.kind,dragState.id,el.dataset.id);
  }
  document.querySelectorAll(".drop-before").forEach(x=>x.classList.remove("drop-before"));
  dragState=null;
});
document.addEventListener("dragend",()=>{
  dragState=null;
  document.querySelectorAll(".dragging").forEach(x=>x.classList.remove("dragging"));
  document.querySelectorAll(".drop-before").forEach(x=>x.classList.remove("drop-before"));
});

render();
</script>
